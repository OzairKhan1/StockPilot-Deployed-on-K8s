apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        readinessProbe:            # TCP check: cheap, no 1s exec timeout problem
          tcpSocket: { port: 27017 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 27017 }
          initialDelaySeconds: 40
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { memory: 1Gi }   # no CPU limit: throttling slows startup
      volumes:
      - name: mongo-data
        hostPath:
          path: /data/mongodb
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb
